<header class="site-header">
  <div class="site-header__inner flex items-center justify-between gap-4">
    <a class="brand" routerLink="/" aria-label="Michèle Ariane — accueil" (click)="closeMenu()">
      Michèle <span>Ariane</span>
    </a>

    <button
      #menuButton
      class="menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg lucideX [size]="22" aria-hidden="true"></svg>
      } @else {
        <svg lucideMenu [size]="22" aria-hidden="true"></svg>
      }
    </button>

    <nav id="primary-navigation" aria-label="Navigation principale" [class.is-open]="menuOpen()">
      <a class="nav-link" routerLink="/projets" routerLinkActive="is-active"
        ariaCurrentWhenActive="page" (click)="closeMenu()">Projets</a>
      <a class="nav-link" routerLink="/parcours" routerLinkActive="is-active"
        ariaCurrentWhenActive="page" (click)="closeMenu()">Parcours</a>
      <a class="pf-button nav-contact" routerLink="/contact" routerLinkActive="is-active"
        ariaCurrentWhenActive="page" (click)="closeMenu()">
        Contact <svg lucideArrowUpRight [size]="17" aria-hidden="true"></svg>
      </a>
    </nav>
  </div>
</header>
